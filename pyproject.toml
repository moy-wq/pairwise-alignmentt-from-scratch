[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "needleman-wunsch"
version = "0.1.0"
description = "Implementation of the Needleman-Wunsch global sequence alignment algorithm"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
"numpy>=1.24"
]

[project.optional-dependencies]
dev = [
"pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]
